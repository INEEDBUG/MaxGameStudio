[package]
name = "cs2-insight-agent-desktop"
version = "3.0.6"
description = "Lightweight Windows desktop shell for MaxGameStudio"
authors = ["MaxGameStudio contributors"]
edition = "2021"

[lib]
name = "cs2_insight_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
rust-test-manifest = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
getrandom = "0.3"

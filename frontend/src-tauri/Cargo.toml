[package]
name = "cs2-insight-agent-desktop"
version = "3.1.2"
description = "Lightweight Windows desktop shell for MaxGameStudio"
authors = ["MaxGameStudio contributors"]
edition = "2021"

[lib]
name = "cs2_insight_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
rust-test-manifest = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.16", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

name: Verify packaged Windows upgrade
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Candidate run ID, or published-3.1.4 for a repair-package retest
        required: true
      candidate_version:
        description: Exact version produced by the candidate run
        required: true
        default: '3.2.0-beta.2'
      league_run_id:
        description: Private League candidate run from the same commit as Main (preferred)
        required: false
      league_tag:
        description: Published League tag used only if no League run is specified (blank to omit)
        required: false
        default: 'league-v1.0.0-beta.2'
      publish_beta:
        description: Publish the two exact private beta installers after verification
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      bundle: ${{ steps.seal_beta.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the fixture process cleanup boundary
        shell: pwsh
        run: ./packaging/windows/tests/fixture-process-stop.test.ps1
      - name: Download stable repair package and completed candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          $baselineFile = 'MaxGameStudio_3.1.4_x64-repair-setup.exe'
          gh release download v3.1.4 --repo $env:GITHUB_REPOSITORY --pattern $baselineFile --dir baseline
          if ($LASTEXITCODE -ne 0) { throw 'Published repair package download failed' }
          $baseline = (Resolve-Path -LiteralPath (Join-Path baseline $baselineFile)).Path
          "MGS_BASELINE_INSTALLER=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($env:CANDIDATE_RUN_ID -eq 'published-3.1.4') {
            "MGS_CANDIDATE_INSTALLER=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MGS_EXPECTED_VERSION=3.1.4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          if ($env:CANDIDATE_RUN_ID -notmatch '^\d+$') { throw 'Invalid candidate run ID' }
          if ($env:CANDIDATE_VERSION -notmatch '^\d+\.\d+\.\d+(?:-(?:beta|rc)\.\d+)?$') { throw 'Invalid candidate version' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.event -ne 'workflow_dispatch' -or
              $run.path -cne '.github/workflows/release-windows.yml' -or $run.head_sha -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Candidate is not a successful manual Release Windows build.'
          }
          "MGS_MAIN_CANDIDATE_SHA=$($run.head_sha)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name "MaxGameStudio-$env:CANDIDATE_VERSION" --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $installers = @(Get-ChildItem candidate -Recurse -File -Filter "MaxGameStudio_$($env:CANDIDATE_VERSION)_x64-setup.exe")
          if ($installers.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          "MGS_CANDIDATE_INSTALLER=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MGS_EXPECTED_VERSION=$env:CANDIDATE_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download and verify the private League candidate
        if: inputs.league_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LEAGUE_RUN_ID: ${{ inputs.league_run_id }}
        run: |
          if ($env:LEAGUE_RUN_ID -notmatch '^\d+$' -or $env:MGS_MAIN_CANDIDATE_SHA -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Provide a private League run ID and a Main candidate run.'
          }
          # The run path stays exact even when CLI workflowName resolves through the default branch.
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:LEAGUE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.event -ne 'push' -or
              $run.path -cne '.github/workflows/release-league-windows.yml' -or $run.head_branch -cne 'codex/all-users-installers' -or
              $run.head_sha -cne $env:MGS_MAIN_CANDIDATE_SHA) {
            throw 'The private League and Main candidate builds must be successful builds of the same commit.'
          }
          $artifact = 'league-toolbox-1.0.0-beta.2-windows-x64'
          $filename = 'MaxGameStudioLeague_1.0.0-beta.2_x64-setup.exe'
          gh run download $env:LEAGUE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $artifact --dir league-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Private League candidate download failed.' }
          $path = (Resolve-Path -LiteralPath (Join-Path league-candidate $filename)).Path
          $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath "$path.sha256" -Raw).Trim() -cne "$sha *$filename") {
            throw 'The private League installer does not match its SHA-256 file.'
          }
          "MGS_LEAGUE_INSTALLER=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MGS_LEAGUE_CANDIDATE_SHA=$($run.head_sha)" >> $env:GITHUB_ENV
      - name: Download and verify the published League installer
        if: inputs.league_run_id == '' && inputs.candidate_run_id != 'published-3.1.4' && inputs.league_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LEAGUE_TAG: ${{ inputs.league_tag }}
        run: |
          $tag = $env:LEAGUE_TAG
          if ($tag -cnotmatch '^league-v(\d+\.\d+\.\d+(?:-beta\.\d+)?)$') { throw 'Invalid League release tag.' }
          $version = $Matches[1]
          $filename = "MaxGameStudioLeague_$($version)_x64-setup.exe"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tag_name -cne $tag -or $release.draft -or $release.prerelease -ne ($version -like '*-beta.*')) {
            throw 'Expected the exact published League release.'
          }
          $assets = @($release.assets | Where-Object { $_.name -ceq $filename })
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$filename"
          if ($assets.Count -ne 1 -or $assets[0].browser_download_url -cne $url -or $assets[0].digest -notmatch '^sha256:[a-f0-9]{64}$') {
            throw 'The exact League installer or its SHA-256 is missing.'
          }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $filename --dir league
          if ($LASTEXITCODE -ne 0) { throw 'League installer download failed.' }
          $path = (Resolve-Path -LiteralPath (Join-Path league $filename)).Path
          $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          if ("sha256:$sha" -ne $assets[0].digest -or (Get-Item -LiteralPath $path).Length -ne $assets[0].size) {
            throw 'Downloaded League installer does not match GitHub release metadata.'
          }
          "MGS_LEAGUE_INSTALLER=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Fingerprint both private beta candidates before testing
        if: inputs.publish_beta
        shell: pwsh
        env:
          MAIN_RUN: ${{ inputs.candidate_run_id }}
          LEAGUE_RUN: ${{ inputs.league_run_id }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'INEEDBUG/MaxGameStudio' -or
              $env:GITHUB_REF_NAME -cne 'codex/all-users-installers' -or
              $env:MGS_EXPECTED_VERSION -cne '3.2.0-beta.2' -or
              $env:MAIN_RUN -notmatch '^\d+$' -or $env:LEAGUE_RUN -notmatch '^\d+$' -or
              $env:MGS_MAIN_CANDIDATE_SHA -cnotmatch '^[a-f0-9]{40}$' -or
              $env:MGS_MAIN_CANDIDATE_SHA -cne $env:MGS_LEAGUE_CANDIDATE_SHA) {
            throw 'Publishing requires both private beta builds from the same commit.'
          }
          $main = 'MaxGameStudio_3.2.0-beta.2_x64-setup.exe'
          $league = 'MaxGameStudioLeague_1.0.0-beta.2_x64-setup.exe'
          if ((Split-Path -Leaf $env:MGS_CANDIDATE_INSTALLER) -cne $main -or
              (Split-Path -Leaf $env:MGS_LEAGUE_INSTALLER) -cne $league) {
            throw 'Expected the two approved beta installer names.'
          }
          $files = @{}
          $files[$main] = $env:MGS_CANDIDATE_INSTALLER
          $files["$main.sig"] = "${env:MGS_CANDIDATE_INSTALLER}.sig"
          $files[$league] = $env:MGS_LEAGUE_INSTALLER
          $files["$league.sha256"] = "${env:MGS_LEAGUE_INSTALLER}.sha256"
          $hashes = @{}
          foreach ($name in $files.Keys) {
            $hashes[$name] = (Get-FileHash -LiteralPath $files[$name] -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if (!(Get-Content -LiteralPath $files["$main.sig"] -Raw).Trim() -or
              (Get-Content -LiteralPath $files["$league.sha256"] -Raw).Trim() -cne "$($hashes[$league]) *$league") {
            throw 'A required candidate signature or checksum is missing or invalid.'
          }
          @{
            sourceSha = $env:MGS_MAIN_CANDIDATE_SHA
            verificationSha = $env:GITHUB_SHA
            verifyRunId = $env:GITHUB_RUN_ID
            candidateRunIds = @($env:MAIN_RUN, $env:LEAGUE_RUN)
            sha256 = $hashes
            paths = $files
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'beta-fingerprint.json') -Encoding utf8
      - name: Verify non-default-directory upgrade and optional coexistence
        shell: pwsh
        run: |
          $options = @{
            Installer = $env:MGS_CANDIDATE_INSTALLER
            BaselineInstaller = $env:MGS_BASELINE_INSTALLER
            ExpectedVersion = $env:MGS_EXPECTED_VERSION
          }
          if ($env:MGS_LEAGUE_INSTALLER) { $options.LeagueInstaller = $env:MGS_LEAGUE_INSTALLER }
          ./packaging/windows/tests/verify-packaged-upgrade.ps1 @options
      - name: Download the preceding League beta for scope upgrade acceptance
        if: inputs.league_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $filename = 'MaxGameStudioLeague_1.0.0-beta.1_x64-setup.exe'
          gh release download league-v1.0.0-beta.1 --repo $env:GITHUB_REPOSITORY --pattern $filename --dir league-baseline
          if ($LASTEXITCODE -ne 0) { throw 'League baseline download failed.' }
          $path = (Resolve-Path -LiteralPath (Join-Path league-baseline $filename)).Path
          if ((Get-FileHash -LiteralPath $path).Hash.ToLowerInvariant() -cne 'e8e06419c5209647ca8f03b5357560d4a03409bbcc2ae8db93cf7dbae044f61b') {
            throw 'League baseline does not match the released beta.1 installer.'
          }
          "MGS_LEAGUE_BASELINE=$path" >> $env:GITHUB_ENV
      - name: Verify all-users installation, scope upgrades and private profiles
        if: inputs.league_run_id != ''
        shell: pwsh
        run: |
          ./packaging/windows/tests/verify-all-users-install.ps1 `
            -Installer $env:MGS_CANDIDATE_INSTALLER -BaselineInstaller $env:MGS_BASELINE_INSTALLER `
            -ExpectedVersion $env:MGS_EXPECTED_VERSION -LeagueInstaller $env:MGS_LEAGUE_INSTALLER `
            -LeagueBaselineInstaller $env:MGS_LEAGUE_BASELINE
      - name: Seal the exact verified beta files
        id: seal_beta
        if: success() && inputs.publish_beta
        shell: pwsh
        run: |
          $record = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'beta-fingerprint.json') -Raw | ConvertFrom-Json -AsHashtable
          $destination = Join-Path $env:RUNNER_TEMP 'verified-beta'
          New-Item -ItemType Directory -Path $destination | Out-Null
          $approved = @(
            'MaxGameStudio_3.2.0-beta.2_x64-setup.exe',
            'MaxGameStudio_3.2.0-beta.2_x64-setup.exe.sig',
            'MaxGameStudioLeague_1.0.0-beta.2_x64-setup.exe',
            'MaxGameStudioLeague_1.0.0-beta.2_x64-setup.exe.sha256'
          )
          foreach ($name in $approved) {
            $copy = Join-Path $destination $name
            Copy-Item -LiteralPath $record.paths[$name] -Destination $copy
            if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash.ToLowerInvariant() -cne $record.sha256[$name]) {
              throw "Candidate changed during installation or copying: $name"
            }
          }
          $record.Remove('paths')
          $record | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $destination 'verified-beta.json') -Encoding utf8
          "bundle=verified-beta-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: success() && inputs.publish_beta
        with:
          name: ${{ steps.seal_beta.outputs.bundle }}
          path: ${{ runner.temp }}/verified-beta
          if-no-files-found: error
          retention-days: 3

  publish:
    if: inputs.publish_beta && needs.verify.result == 'success' && github.event_name == 'workflow_dispatch' && github.repository == 'INEEDBUG/MaxGameStudio' && github.ref_name == 'codex/all-users-installers'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: promote-verified-windows-beta
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.bundle }}
          path: verified-beta
      - name: Verify release metadata safeguards
        run: node --test packaging/windows/publish-verified-beta.test.mjs
      - name: Publish the verified beta pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packaging/windows/publish-verified-beta.mjs verified-beta

name: Verify native installers on Windows

on:
  workflow_call:
    inputs:
      main_version:
        required: true
        type: string
      league_version:
        type: string
        default: '1.0.0-beta.10'
      league_startup_only:
        type: boolean
        default: false
      league_sign_update:
        type: boolean
        default: false
      backend_only:
        type: boolean
        default: false
      deliver:
        type: boolean
        default: false
    secrets:
      main_signing_key:
        required: false
      league_signing_key:
        required: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CARGO_INCREMENTAL: '0'
      MAIN_VERSION: ${{ inputs.main_version }}
      LEAGUE_VERSION: ${{ inputs.league_version }}
      LEAGUE_PREDECESSOR_VERSION: 1.0.0-beta.9
      LEAGUE_PIN: 14557723706ccc0e0a9d62c470141d4cb7190fcd
      FIXTURE_PYTHON_VERSION: '3.12.10'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: ${{ !inputs.league_startup_only && !inputs.backend_only }}
        with:
          version: '11.9.0'
          run_install: false
      - uses: actions/setup-node@v4
        if: ${{ !inputs.backend_only }}
        with:
          node-version: '24'
          cache: ${{ !inputs.league_startup_only && 'pnpm' || '' }}
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        if: ${{ !inputs.league_startup_only && !inputs.backend_only }}
        with:
          python-version: '3.12.10'
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify native parsing on the pinned public Demo
        id: native-parser
        if: ${{ !inputs.league_startup_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = Join-Path $env:RUNNER_TEMP 'mgs-parser-source'
          $worker = ./packaging/demoparser-lean/stage-native-worker.ps1 -SourceRoot $source
          $demo = Join-Path $env:RUNNER_TEMP 'mgs-public-test-demo.dem'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/LaihoE/demoparser/db3ba5f7a1b02b8cb27d0063d52649883a98469c/src/parser/test_demo.dem' -OutFile $demo -TimeoutSec 90
          if ((Get-Item -LiteralPath $demo).Length -ne 60601900 -or
              (Get-FileHash -LiteralPath $demo -Algorithm SHA256).Hash -ine '84a1a4191302bdd2a3bbb5a727842093744b1fb1a228aeec630369e44b622cb2') {
            throw 'The public Demo did not match the pinned fixture bytes.'
          }
          $env:MGS_ANALYSIS_EVENTS_FIXTURE = $demo
          $env:MGS_REPLAY_TRAJECTORY_FIXTURE = $env:MGS_ANALYSIS_EVENTS_FIXTURE
          $env:CARGO_TARGET_DIR = Join-Path (Get-Location).Path 'frontend/src-tauri/target'
          cargo test --release --locked --manifest-path $worker.Manifest -- --include-ignored --test-threads=1
          (Get-FileHash -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/maxgamestudio-parser-worker.exe')).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'mgs-native-parser-sha256.txt') -Encoding ascii

      - name: Verify the native Main backend and owned media fixtures
        if: ${{ !cancelled() && !inputs.league_startup_only && steps.rust.outcome == 'success' }}
        shell: pwsh
        env:
          NATIVE_PARSER_VERIFIED: ${{ steps.native-parser.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $fixture = Join-Path $env:RUNNER_TEMP 'mgs-native-core-fixtures'
          $null = New-Item -ItemType Directory -Path $fixture
          $archive = Join-Path $fixture 'ffmpeg.zip'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip' -OutFile $archive -TimeoutSec 90
          if ((Get-Item -LiteralPath $archive).Length -ne 109728040 -or
              (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec') {
            throw 'FFmpeg fixture tool download did not match its pinned release.'
          }
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($name in 'ffmpeg.exe', 'ffprobe.exe') {
              $entries = @($zip.Entries | Where-Object { $_.FullName -clike "*/bin/$name" })
              if ($entries.Count -ne 1) { throw "Unexpected FFmpeg archive entry: $name" }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0], (Join-Path $fixture $name))
            }
          } finally { $zip.Dispose() }
          [IO.File]::Delete($archive)
          $source = Join-Path $fixture 'synthetic-playback.rs'
          @'
          use std::{fs, io, thread, time::Duration};
          fn main() -> io::Result<()> {
              fs::write("csgo/cfg/cs2_user.cfg", b"fixture profile changed")?;
              thread::sleep(Duration::from_secs(30));
              Ok(())
          }
          '@ | Set-Content -LiteralPath $source -Encoding utf8
          rustc --edition 2021 $source -o (Join-Path $fixture 'synthetic-playback-fixture.exe')
          $env:MGS_PLAYBACK_TEST_ROOT = $fixture
          $env:MGS_QUEUE_TEST_FFMPEG = Join-Path $fixture 'ffmpeg.exe'
          $env:MGS_LITECUT_VIDEO_TEST_FFMPEG = $env:MGS_QUEUE_TEST_FFMPEG
          $env:MGS_LITECUT_VIDEO_TEST_SCRATCH = $fixture
          $env:CARGO_TARGET_DIR = Join-Path (Get-Location).Path 'frontend/src-tauri/target'
          $core = @('--release','--locked','--manifest-path','rust/Cargo.toml','-p','maxgamestudio-core','--features','native-http')
          cargo test @core -- --test-threads=1
          cargo test @core --test native_http cancelled_recording_queue_restores_fixture_player_data -- --exact --ignored
          cargo test @core --test native_http lite_cut_generates_preview_and_waveform_for_an_existing_asset -- --exact --ignored
          cargo test @core --lib ffmpeg_upper_video_uses_source_trim_layer_order_fades_and_copies_base_aac -- --ignored
          cargo test @core --lib ffmpeg_base_canvas_places_animated_position_size_and_opacity -- --ignored
          cargo test @core --lib ffmpeg_base_speed_keyframes_keep_video_and_audio_in_the_same_timeline -- --ignored
          if ($env:NATIVE_PARSER_VERIFIED -eq 'true') {
            $env:MGS_NATIVE_PUBLIC_DEMO = Join-Path $env:RUNNER_TEMP 'mgs-public-test-demo.dem'
            $env:MGS_NATIVE_PARSER_EXE = Join-Path $env:CARGO_TARGET_DIR 'release/maxgamestudio-parser-worker.exe'
            cargo test @core --test native_http analyzes_a_real_demo_from_both_entry_points_and_rolls_back_a_failed_save -- --exact --ignored
          }

      - name: Verify the exact released baselines
        if: ${{ !inputs.league_startup_only && !inputs.backend_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
              $env:MAIN_VERSION -cnotmatch '^(\d+\.\d+\.\d+-beta\.)([1-9]\d*)$' -or [int]$Matches[2] -lt 2) {
            throw 'Expected the exact checkout and a beta with an adjacent positive beta version.'
          }
          "MAIN_PREDECESSOR_VERSION=$($Matches[1])$([int]$Matches[2] - 1)" >> $env:GITHUB_ENV
          $inputs = [ordered]@{
            'main-stable' = @{ Version='3.1.4'; Hash='583201413a2b31d94f3009766a22dfa6cda65ddb6eba3847d3895eefdf863c1e' }
            'league-beta' = @{ Version='1.0.0-beta.5'; Hash='d34f181569e03f8079e48d9a080706eadd6943205a08f3669d5f1f802ec1c3d4' }
          }
          $state = @{}
          $base = Join-Path $env:RUNNER_TEMP 'mgs-native-baselines'
          foreach ($kind in $inputs.Keys) {
            $metadata = node packaging/windows/release-baseline.mjs $kind | ConvertFrom-Json
            if ($metadata.version -cne $inputs[$kind].Version -or $metadata.sha256 -cne $inputs[$kind].Hash) {
              throw "The $kind baseline does not match the shipped file catalog."
            }
            gh release download $metadata.tag --repo $env:GITHUB_REPOSITORY --pattern $metadata.name --dir $base
            $file = Get-Item -LiteralPath (Join-Path $base $metadata.name)
            if ($file.Length -ne $metadata.size -or (Get-FileHash -LiteralPath $file.FullName).Hash -ine $metadata.sha256) {
              throw "The downloaded $kind installer does not match the published bytes."
            }
            $state[$kind] = @{ path=$file.FullName; version=$metadata.version; hash=$metadata.sha256 }
          }
          $state | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'mgs-native-baselines.json') -Encoding utf8

      - name: Build the adjacent Main baseline installer
        if: ${{ !inputs.league_startup_only && !inputs.backend_only }}
        shell: pwsh
        run: ./packaging/windows/build-native-candidate.ps1 -Product Main -Version $env:MAIN_PREDECESSOR_VERSION

      - name: Build the adjacent League baseline installer
        if: ${{ !inputs.league_startup_only && !inputs.backend_only }}
        shell: pwsh
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: ./packaging/windows/build-native-candidate.ps1 -Product League -Version $env:LEAGUE_PREDECESSOR_VERSION

      - name: Inventory the exact installed native baselines
        if: ${{ !inputs.league_startup_only && !inputs.backend_only }}
        shell: pwsh
        run: |
          ./packaging/windows/tests/verify-native-successors.ps1 -Phase Catalog `
            -Directory (Join-Path $env:RUNNER_TEMP 'mgs-native-candidates') `
            -MainBaselineVersion $env:MAIN_PREDECESSOR_VERSION -LeagueBaselineVersion $env:LEAGUE_PREDECESSOR_VERSION

      - name: Build the native Main installer
        if: ${{ !inputs.league_startup_only && !inputs.backend_only }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.main_signing_key }}
        run: |
          ./packaging/windows/build-native-candidate.ps1 -Product Main -Version $env:MAIN_VERSION `
            -PredecessorCatalog (Join-Path $env:RUNNER_TEMP 'mgs-native-candidates/main-native-predecessor.json')

      - name: Build the native League installer
        if: ${{ !inputs.backend_only }}
        shell: pwsh
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          INCLUDE_PREDECESSOR: ${{ !inputs.league_startup_only }}
        run: |
          $argsForLeague = @{}
          if ($env:INCLUDE_PREDECESSOR -eq 'true') {
            $argsForLeague.PredecessorCatalog = Join-Path $env:RUNNER_TEMP 'mgs-native-candidates/league-native-predecessor.json'
          }
          ./packaging/windows/build-native-candidate.ps1 -Product League -Version $env:LEAGUE_VERSION @argsForLeague

      - name: Prepare the pinned League updater signing tool
        if: ${{ inputs.league_startup_only && inputs.league_sign_update && !inputs.backend_only }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tool = Join-Path $env:RUNNER_TEMP 'league-tauri-signer'
          npm.cmd install --prefix $tool --no-save --no-package-lock --ignore-scripts --no-audit --no-fund '@tauri-apps/cli@2.11.4'

      - name: Sign the exact native League Beta installer for the updater
        if: ${{ inputs.league_startup_only && inputs.league_sign_update && !inputs.backend_only }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.league_signing_key }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mgs-native-candidates/MaxGameStudioLeague_$($env:LEAGUE_VERSION)_x64-setup.exe"
          $cli = Join-Path $env:RUNNER_TEMP 'league-tauri-signer/node_modules/@tauri-apps/cli/tauri.js'
          ./packaging/windows/league-standalone/sign-beta-update.ps1 -Installer $installer -TauriCli $cli

      - name: Verify the native League backend
        if: ${{ !inputs.backend_only }}
        shell: pwsh
        env:
          VERIFY_SIGNED_LEAGUE: ${{ inputs.league_startup_only && inputs.league_sign_update }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $renderer = "dist-$env:LEAGUE_VERSION"
          $env:TAURI_CONFIG = @{
            version=$env:LEAGUE_VERSION; build=@{frontendDist=$renderer}; bundle=@{icon=@("$renderer/league.ico")}
          } | ConvertTo-Json -Depth 4 -Compress
          cargo test --release --locked --manifest-path rust/league-desktop/Cargo.toml --target x86_64-pc-windows-msvc -- --test-threads=1
          if ($env:VERIFY_SIGNED_LEAGUE -eq 'true') {
            $env:MGS_LEAGUE_SIGNED_UPDATE_INSTALLER = Join-Path $env:RUNNER_TEMP "mgs-native-candidates/MaxGameStudioLeague_$($env:LEAGUE_VERSION)_x64-setup.exe"
            $env:MGS_LEAGUE_SIGNED_UPDATE_VERSION = $env:LEAGUE_VERSION
            $signedTest = @(cargo test --release --locked --manifest-path rust/league-desktop/Cargo.toml --target x86_64-pc-windows-msvc signed_release_installer_matches_embedded_league_key -- --ignored)
            $signedTest
            if (!($signedTest -match 'signed_release_installer_matches_embedded_league_key \.\.\. ok$')) {
              throw 'The exact signed League installer did not pass the updater verification.'
            }
          }

      - name: Verify installed League startup as an ordinary Windows user
        if: ${{ inputs.league_startup_only && !inputs.backend_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected startup verification checkout.' }
          $installer = Join-Path $env:RUNNER_TEMP "mgs-native-candidates/MaxGameStudioLeague_$($env:LEAGUE_VERSION)_x64-setup.exe"
          $binary = Join-Path $env:RUNNER_TEMP "league-native-payload-$($env:LEAGUE_VERSION)/MaxGameStudioLeagueToolbox.exe"
          $sha = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
          ./packaging/windows/tests/verify-native-league-boot.ps1 -Installer $installer -Version $env:LEAGUE_VERSION -ExecutableSha256 $sha

      - name: Retain the verified League installer for Windows acceptance
        if: ${{ inputs.league_startup_only && inputs.league_sign_update && !inputs.backend_only }}
        uses: actions/upload-artifact@v4
        with:
          name: league-native-${{ inputs.league_version }}
          path: |
            ${{ runner.temp }}/mgs-native-candidates/MaxGameStudioLeague_${{ inputs.league_version }}_x64-setup.exe
            ${{ runner.temp }}/mgs-native-candidates/MaxGameStudioLeague_${{ inputs.league_version }}_x64-setup.exe.sig
          if-no-files-found: error
          retention-days: 1

      - name: Verify both native successors and their existing data
        if: ${{ !inputs.league_startup_only && !inputs.backend_only }}
        shell: pwsh
        run: |
          ./packaging/windows/tests/verify-native-successors.ps1 -Phase Verify `
            -Directory (Join-Path $env:RUNNER_TEMP 'mgs-native-candidates') `
            -MainBaselineVersion $env:MAIN_PREDECESSOR_VERSION -LeagueBaselineVersion $env:LEAGUE_PREDECESSOR_VERSION `
            -MainVersion $env:MAIN_VERSION -LeagueVersion $env:LEAGUE_VERSION `
            -FixturePythonExe (Join-Path $env:pythonLocation 'python.exe') -FixturePythonVersion $env:FIXTURE_PYTHON_VERSION

      - name: Verify personal and machine upgrades and measure both products
        id: native-installed
        if: ${{ !inputs.league_startup_only && !inputs.backend_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'mgs-native-baselines.json') -Raw | ConvertFrom-Json
          $main = $baseline.'main-stable'
          $league = $baseline.'league-beta'
          $out = Join-Path $env:RUNNER_TEMP 'mgs-native-candidates'
          $pair = @{
            Installer=(Join-Path $out "MaxGameStudio_$($env:MAIN_VERSION)_x64-setup.exe")
            LeagueInstaller=(Join-Path $out "MaxGameStudioLeague_$($env:LEAGUE_VERSION)_x64-setup.exe")
            BaselineInstaller=$main.path; BaselineVersion=$main.version; BaselineSha256=$main.hash
            LeagueBaselineInstaller=$league.path; LeagueBaselineVersion=$league.version; LeagueBaselineSha256=$league.hash
            ExpectedVersion=$env:MAIN_VERSION; NativePayloads=$true
            FixturePythonExe=(Join-Path $env:pythonLocation 'python.exe'); FixturePythonVersion=$env:FIXTURE_PYTHON_VERSION
          }
          $pair.CandidateSha256 = (Get-FileHash -LiteralPath $pair.Installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $pair.LeagueCandidateSha256 = (Get-FileHash -LiteralPath $pair.LeagueInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          $parserHash = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'mgs-native-parser-sha256.txt') -Raw).Trim()
          node packaging/windows/tests/verify-native-updaters.mjs --signed-main-package $pair.Installer
          if ($LASTEXITCODE -ne 0) { throw 'The Main candidate signature did not verify.' }
          ./packaging/windows/tests/verify-packaged-upgrade.ps1 @pair -ParserWorkerSha256 $parserHash
          ./packaging/windows/tests/verify-all-users-install.ps1 @pair
          foreach ($path in $pair.Installer, $pair.LeagueInstaller) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = if ($path -eq $pair.Installer) { $pair.CandidateSha256 } else { $pair.LeagueCandidateSha256 }
            if ($hash -cne $expected) { throw 'A verified installer changed during the run.' }
            Write-Host "NATIVE_SMOKE_PACKAGE_VERIFIED: $(Split-Path -Leaf $path) sha256=$hash source=$env:GITHUB_SHA"
          }
          "main_sha256=$($pair.CandidateSha256)" >> $env:GITHUB_OUTPUT
          "league_sha256=$($pair.LeagueCandidateSha256)" >> $env:GITHUB_OUTPUT

      - name: Collect the verified beta pair and installed inventories
        if: ${{ inputs.deliver && !inputs.league_startup_only && !inputs.backend_only }}
        shell: pwsh
        env:
          MAIN_VERIFIED_SHA: ${{ steps.native-installed.outputs.main_sha256 }}
          LEAGUE_VERIFIED_SHA: ${{ steps.native-installed.outputs.league_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = Join-Path $env:RUNNER_TEMP 'mgs-native-candidates'
          $out = Join-Path $env:RUNNER_TEMP 'mgs-native-beta-pair'
          $null = New-Item -ItemType Directory -Path $out
          $main = "MaxGameStudio_$($env:MAIN_VERSION)"
          $league = "MaxGameStudioLeague_$($env:LEAGUE_VERSION)"
          $setups = [ordered]@{
            "${main}_x64-setup.exe" = $env:MAIN_VERIFIED_SHA
            "${league}_x64-setup.exe" = $env:LEAGUE_VERIFIED_SHA
          }
          $names = @($setups.Keys) + @("${main}_x64-setup.exe.sig", "${main}_program-inventory.json", "${league}_program-inventory.json")
          $files = [ordered]@{}
          foreach ($name in $names) {
            Copy-Item -LiteralPath (Join-Path $source $name) -Destination $out
            $file = Get-Item -LiteralPath (Join-Path $out $name)
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            if ($setups.Contains($name) -and $hash -cne $setups[$name]) { throw "Verified package changed: $name" }
            $files[$name] = @{ sha256=$hash; bytes=$file.Length }
          }
          node packaging/windows/tests/verify-native-updaters.mjs --signed-main-package (Join-Path $out "${main}_x64-setup.exe")
          [ordered]@{
            repository=$env:GITHUB_REPOSITORY; commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID
            run_attempt=$env:GITHUB_RUN_ATTEMPT; main=$env:MAIN_VERSION; league=$env:LEAGUE_VERSION; files=$files
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $out 'verified-pair.json') -Encoding utf8

      - name: Upload the verified Windows beta pair
        if: ${{ inputs.deliver && !inputs.league_startup_only && !inputs.backend_only }}
        uses: actions/upload-artifact@v4
        with:
          name: MaxGameStudio-native-beta-pair-${{ github.sha }}
          path: ${{ runner.temp }}/mgs-native-beta-pair/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

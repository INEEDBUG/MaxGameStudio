name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Private release-candidate version"
        required: true
        default: "3.1.0"
  push:
    branches:
      - "main"
    tags:
      - "v*"
      - "V*"

concurrency:
  group: release-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Resolve release version
        id: release_version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $env:LATEST_RELEASE_TAG = ""
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:LATEST_RELEASE_TAG = ""
          } else {
            $latestTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $latestTag) { $latestTag = "v0.0.0" }
            $env:LATEST_RELEASE_TAG = $latestTag.Trim()
          }
          $version = node frontend/scripts/release-version.mjs
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Failed to resolve release version" }
          $stable = $version -match '^\d+\.\d+\.\d+$'
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "stable=$($stable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if (-not $stable) {
            Write-Host "Version $version is a prerelease; formal Release, latest.json, and updater publication will be skipped."
          }
          Write-Host "Resolved release version: $version"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build pinned MaxGameStudio League runtime
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "maxgamestudio-league-v1.5.1"
          git init --quiet $source
          git -C $source remote add origin https://github.com/LeagueAkari/LeagueAkari.git
          git -C $source fetch --depth 1 origin 14557723706ccc0e0a9d62c470141d4cb7190fcd
          git -C $source checkout --detach 14557723706ccc0e0a9d62c470141d4cb7190fcd
          Push-Location $source
          try {
            corepack.cmd yarn install --immutable
            if ($LASTEXITCODE -ne 0) { throw "Pinned League runtime dependency install failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          ./packaging/windows/stage-league-runtime.ps1 -SourceDir $source -Build

      - name: Install backend test dependencies
        run: uv sync --frozen

      - name: Build and verify patched demoparser runtime
        shell: pwsh
        run: |
          ./packaging/demoparser-lean/build-wheel.ps1 -PythonExe python -OutputDir "dist/wheels"
          $wheel = Get-ChildItem "dist/wheels/demoparser2-*-cp312-*.whl" | Select-Object -First 1
          if (-not $wheel) { throw "CPython 3.12 patched demoparser wheel not found" }
          $runtime = Get-Content "packaging/demoparser-lean/demoparser-runtime.json" -Raw | ConvertFrom-Json
          uv run --no-project --with $wheel.FullName python -c "import importlib.metadata as m, sys; from demoparser2 import DemoParser; assert m.version('demoparser2') == sys.argv[1]; assert hasattr(DemoParser, 'write_replay_parquet'); assert hasattr(DemoParser, 'read_replay_parquet_round_binary')" $runtime.distribution_version
          if ($LASTEXITCODE -ne 0) { throw "Built demoparser wheel verification failed" }
          $hash = (Get-FileHash -LiteralPath $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Join-Path $wheel.DirectoryName "demoparser2-SHA256SUMS.txt"),
            "$hash  $($wheel.Name)`n",
            [Text.UTF8Encoding]::new($false)
          )
          $env:PYTHONPATH = "backend"
          uv run --frozen python -m app.demoparser_runtime

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: uv run --frozen python -m pytest backend/tests -q

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Check Rust formatting
        working-directory: frontend/src-tauri
        run: cargo fmt --check

      - name: Run Rust lints
        working-directory: frontend/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        working-directory: frontend/src-tauri
        run: cargo test --locked

      - name: Import Windows code-signing certificate
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) {
            Write-Warning "WINDOWS_PFX_BASE64 is not configured; producing an installer without Authenticode. The mandatory Tauri updater signature and SHA-256 checks remain enabled."
            exit 0
          }
          if (-not $env:WINDOWS_PFX_PASSWORD) { throw "WINDOWS_PFX_PASSWORD is required when WINDOWS_PFX_BASE64 is configured" }
          $pfxPath = Join-Path $env:RUNNER_TEMP "max-game-studio-code-signing.pfx"
          try {
            $encoded = $env:WINDOWS_PFX_BASE64 -replace '-----BEGIN [^-]+-----', '' -replace '-----END [^-]+-----', '' -replace '\s', ''
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($encoded))
            $password = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object HasPrivateKey |
              Select-Object -First 1
            if (-not $certificate) { throw "The imported PFX did not contain a code-signing certificate with a private key" }
            "CS2_INSIGHT_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            # The League workspace can be launched through UAC independently
            # from the Tauri host. Sign that executable too, then refresh the
            # payload manifest that is embedded into the host at compile time.
            $runtimeRoot = (Resolve-Path "frontend/.runtime-cache/league-runtime").Path
            $runtimeExe = Join-Path $runtimeRoot "MaxGameStudioLeague.exe"
            $runtimeSignature = Set-AuthenticodeSignature `
              -FilePath $runtimeExe `
              -Certificate $certificate `
              -HashAlgorithm SHA256 `
              -TimestampServer "http://timestamp.comodoca.com"
            if ($runtimeSignature.Status -ne 'Valid') {
              throw "Embedded League runtime signing failed: $($runtimeSignature.Status)"
            }
            $runtimeHashes = [ordered]@{}
            Get-ChildItem -LiteralPath $runtimeRoot -Recurse -File | Where-Object {
              $_.Name -ne "maxgamestudio-runtime-hashes.json"
            } | Sort-Object FullName | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($runtimeRoot, $_.FullName).Replace('\', '/')
              $runtimeHashes[$relative] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            [IO.File]::WriteAllText(
              (Join-Path $runtimeRoot "maxgamestudio-runtime-hashes.json"),
              ($runtimeHashes | ConvertTo-Json -Depth 10),
              [Text.UTF8Encoding]::new($false)
            )
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build Tauri desktop installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY is not configured" }
          $wheel = Get-ChildItem "dist/wheels/demoparser2-*-cp312-*.whl" | Select-Object -First 1
          if (-not $wheel) { throw "CPython 3.12 lean demoparser wheel not found" }
          $env:CS2_INSIGHT_DEMOPARSER_WHEEL = $wheel.FullName
          $env:CS2_INSIGHT_REFRESH_PYTHON = "1"
          $ver = $env:BUILD_VERSION -replace '^[vV]', ''
          Push-Location frontend
          try {
            pnpm.cmd run desktop:build:ver -- $ver
            if ($LASTEXITCODE -ne 0) { throw "Tauri build failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $updaterSignature = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis" -Filter "*.exe.sig" -File | Select-Object -First 1
          if (-not $updaterSignature) { throw "Signed Tauri updater artifact was not created" }

      - name: Verify bundled Python runtime
        shell: pwsh
        run: |
          $resources = (Resolve-Path "frontend/src-tauri/bundle-resources").Path
          $py = Join-Path $resources "python/python.exe"
          if (-not (Test-Path -LiteralPath $py)) { throw "Bundled python.exe not found" }
          $env:PYTHONNOUSERSITE = "1"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $backend = Join-Path $resources "backend"
          & $py -c "import sys; sys.path.insert(0, sys.argv[1]); import app.main, demoparser2, fastapi, importlib.metadata as m, importlib.util as u, openai, PIL, uvicorn; assert u.find_spec('numpy') is None; assert u.find_spec('pandas') is None; assert u.find_spec('polars') is None; assert u.find_spec('pyarrow') is None; print('runtime-ok', m.version('demoparser2'))" $backend
          if ($LASTEXITCODE -ne 0) { throw "Bundled runtime verification failed: $LASTEXITCODE" }
          $expectedVersion = $env:BUILD_VERSION -replace '^[vV]', ''
          $bundledVersion = (Get-Content (Join-Path $backend "app/release_version.txt") -Raw).Trim()
          if ($bundledVersion -ne $expectedVersion) { throw "Bundled backend version mismatch: expected $expectedVersion, got $bundledVersion" }

      - name: Report bundled runtime size
        shell: pwsh
        # The pinned Electron League workbench includes Chromium license and
        # graphics fallback files. Keep the resource gate below the 500 MiB
        # installed-footprint gate without stripping required runtime files.
        run: ./packaging/windows/report-runtime-size.ps1 -Root "frontend/src-tauri/bundle-resources" -OutputPath "dist/runtime-size-report.json" -BudgetMiB 450

      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath "frontend/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          $installer = $artifacts | Select-Object -First 1
          if (-not $installer) { throw "Tauri NSIS installer not found" }
          $installerMiB = $installer.Length / 1MB
          Write-Host ("Installer size: {0:N2} MiB" -f $installerMiB)
          if ($installerMiB -gt 400) { throw ("Installer exceeds 400 MiB budget: {0:N2} MiB" -f $installerMiB) }
          $appExe = Get-Item "frontend/src-tauri/target/release/cs2-insight-agent-desktop.exe"
          if ($env:CS2_INSIGHT_WINDOWS_CERTIFICATE_THUMBPRINT) {
            $expectedThumbprint = $env:CS2_INSIGHT_WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', ''
            $leagueRuntimeExe = Get-Item "frontend/src-tauri/bundle-resources/league-runtime/MaxGameStudioLeague.exe"
            foreach ($artifact in @($appExe, $installer, $leagueRuntimeExe)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
              if ($signature.Status -ne 'Valid') { throw "Authenticode validation failed for $($artifact.Name): $($signature.Status)" }
              if ($signature.SignerCertificate.Thumbprint -ne $expectedThumbprint) {
                throw "Unexpected signing certificate for $($artifact.Name): $($signature.SignerCertificate.Thumbprint)"
              }
            }
          }
          $resourceBytes = (Get-ChildItem "frontend/src-tauri/bundle-resources" -Recurse -File | Measure-Object Length -Sum).Sum
          $installedMiB = ($appExe.Length + $resourceBytes) / 1MB
          Write-Host ("Estimated installed size: {0:N2} MiB" -f $installedMiB)
          if ($installedMiB -gt 500) { throw ("Installed footprint exceeds 500 MiB budget: {0:N2} MiB" -f $installedMiB) }
          $sums = $artifacts | Sort-Object Name | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $_.Name
          }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) "SHA256SUMS"), $sums, [Text.UTF8Encoding]::new($false))

      - name: Resolve GitHub Release notes
        id: release_notes
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.release_version.outputs.stable == 'true'
        shell: pwsh
        run: |
          $notesPath = "docs/releases/v$env:BUILD_VERSION.zh-CN.md"
          $userNotesPath = "docs/update-notes/v$env:BUILD_VERSION.json"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Stable Release notes are required: $notesPath"
          }
          if (-not (Test-Path -LiteralPath $userNotesPath)) {
            throw "Plain-language update notes are required: $userNotesPath"
          }
          $userNotes = Get-Content -LiteralPath $userNotesPath -Raw | ConvertFrom-Json
          if ([string]$userNotes.version -ne $env:BUILD_VERSION) {
            throw "Plain-language update notes version must match $env:BUILD_VERSION"
          }
          if ([string]$userNotes.releaseStatus -ne "stable") {
            throw "Stable tags require releaseStatus=stable in $userNotesPath"
          }
          "path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "user_path=$userNotesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate signed updater manifest
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.release_version.outputs.stable == 'true'
        working-directory: frontend
        env:
          RELEASE_NOTES: "本版本已经发布，可在客户端内点击立即更新。完整更新说明请查看 GitHub Release。"
          USER_RELEASE_NOTES_PATH: ${{ github.workspace }}/${{ steps.release_notes.outputs.user_path }}
          UPDATE_MODE: normal
        run: node scripts/generate-github-updater-manifest.mjs

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.release_version.outputs.stable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_version.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: frontend/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updater channel
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.release_version.outputs.stable == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestPath = "frontend/src-tauri/target/release/bundle/nsis/latest.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw "latest.json was not generated" }
          $branch = "updater"
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>$null
          $branchExists = $LASTEXITCODE -eq 0
          if (-not $branchExists) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$env:GITHUB_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to create updater branch" }
          }
          $existingJson = gh api "repos/$env:GITHUB_REPOSITORY/contents/latest.json?ref=$branch" 2>$null
          $fileExists = $LASTEXITCODE -eq 0
          $existing = if ($fileExists) { $existingJson | ConvertFrom-Json } else { $null }
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $manifestPath)))
          $args = @(
            "api", "--method", "PUT", "repos/$env:GITHUB_REPOSITORY/contents/latest.json",
            "-f", "message=Publish updater manifest $env:BUILD_VERSION",
            "-f", "branch=$branch",
            "-f", "content=$content"
          )
          if ($existing.sha) { $args += @("-f", "sha=$($existing.sha)") }
          & gh @args | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish updater manifest" }

      - name: Upload private release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MaxGameStudio-${{ inputs.version }}
          retention-days: 14
          if-no-files-found: error
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe

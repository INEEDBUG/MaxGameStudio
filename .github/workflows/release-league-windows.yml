name: Sign HKsLGT Beta bridge

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft League beta.13 migration release ID
        required: true
        type: string
      installer_sha256:
        description: SHA-256 from the verified HKsLGT build
        required: true
        type: string

permissions:
  contents: write

jobs:
  sign:
    if: github.repository == 'INEEDBUG/MaxGameStudio' && github.ref == 'refs/heads/codex/hkslgt-beta-bridge'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Verify exact migration installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_HASH: ${{ inputs.installer_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DRAFT_RELEASE_ID -cnotmatch '^[1-9][0-9]*$' -or $env:EXPECTED_HASH -cnotmatch '^[a-f0-9]{64}$') {
            throw 'Invalid draft release ID or installer hash.'
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'}
          $draft = Invoke-RestMethod -Uri "$api/releases/$env:DRAFT_RELEASE_ID" -Headers $headers
          if (!$draft.draft -or !$draft.prerelease -or $draft.tag_name -cne 'league-v1.0.0-beta.13') {
            throw 'Expected the draft beta.13 compatibility release.'
          }
          $name = 'MaxGameStudioLeague_1.0.0-beta.13_x64-setup.exe'
          $assets = @($draft.assets | Where-Object { $_.name -ceq $name })
          if ($assets.Count -ne 1 -or $assets[0].digest -cne "sha256:$env:EXPECTED_HASH") {
            throw 'The exact migration asset was not found.'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'hkslgt-signing'
          $null = New-Item -ItemType Directory -Path $directory
          $installer = Join-Path $directory $name
          $headers.Accept = 'application/octet-stream'
          Invoke-WebRequest -Uri "$api/releases/assets/$($assets[0].id)" -Headers $headers -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer).Hash -ine $env:EXPECTED_HASH) {
            throw 'The migration asset changed in transit.'
          }
          "VERIFIED_INSTALLER=$installer" >> $env:GITHUB_ENV
      - name: Sign with the existing League updater key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LEAGUE_TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tool = Join-Path $env:RUNNER_TEMP 'tauri-cli'
          npm.cmd install --prefix $tool --no-save --no-package-lock --ignore-scripts --no-fund --no-audit '@tauri-apps/cli@2.11.4'
          ./packaging/windows/league-standalone/sign-beta-update.ps1 -Installer $env:VERIFIED_INSTALLER -TauriCli (Join-Path $tool 'node_modules/@tauri-apps/cli/tauri.js')
      - uses: actions/upload-artifact@v4
        with:
          name: hkslgt-beta-13-signature
          path: ${{ env.VERIFIED_INSTALLER }}.sig
          if-no-files-found: error
          retention-days: 1

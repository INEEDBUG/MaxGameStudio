[workspace]
members = ["maxgamestudio-core", "league-core"]
exclude = ["league-desktop"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

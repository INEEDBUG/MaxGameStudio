[package]
name = "maxgamestudio-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
native-http = ["dep:base64", "dep:futures-util", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:parquet", "dep:percent-encoding", "dep:sha2", "dep:tokio", "dep:tokio-websockets", "dep:tower-http", "dep:windows-sys"]

[dependencies]
base64 = { version = "=0.22.1", optional = true }
form_urlencoded = "=1.2.2"
futures-util = { version = "=0.3.32", default-features = false, features = ["std", "sink"], optional = true }
http-body-util = { version = "=0.1.3", optional = true }
hyper = { version = "=1.9.0", features = ["http1", "server"], optional = true }
hyper-util = { version = "=0.1.20", features = ["tokio"], optional = true }
parquet = { version = "=59.1.0", default-features = false, features = ["zstd"], optional = true }
percent-encoding = { version = "=2.3.2", optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "=0.10.9", optional = true }
subtle = "=2.6.1"
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["io-util", "net", "process", "rt", "sync", "time"], optional = true }
tokio-websockets = { version = "=0.13.3", default-features = false, features = ["client", "fastrand", "sha1_smol"], optional = true }
tower-http = { version = "=0.6.8", default-features = false, features = ["fs"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"], optional = true }

[dev-dependencies]
tokio-websockets = { version = "=0.13.3", default-features = false, features = ["server", "sha1_smol"] }

[[bin]]
name = "maxgamestudio-native-http"
required-features = ["native-http"]

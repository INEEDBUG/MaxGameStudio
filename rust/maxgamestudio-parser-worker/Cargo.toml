[package]
name = "maxgamestudio-parser-worker"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace]

[dependencies]
parquet = { version = "=59.1.0", default-features = false, features = ["zstd"] }
parser = { path = "../../src/parser" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
memmap2 = "=0.9.4"

[profile.dev.package.parser]
overflow-checks = false

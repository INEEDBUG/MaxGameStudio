[package]
name = "maxgamestudio-league-desktop"
version = "1.0.0-beta.8"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
base64 = "=0.22.1"
hex = "=0.4.3"
maxgamestudio-league-core = { path = "../league-core" }
minisign-verify = "=0.2.5"
reqwest = { version = "=0.13.2", default-features = false, features = ["rustls-no-provider"] }
ring = "=0.17.14"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "=2.5.3"
tauri-plugin-single-instance = "=2.4.3"
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.16.0", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
